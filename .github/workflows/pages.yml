name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 'actions: write' lets configure-pages turn Pages on itself via enablement,
# so the site deploys without anyone flipping the Settings -> Pages switch.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Pages revalidates HTML sooner than it revalidates assets/*.js, so a
      # returning visitor can get the new index.html wired to the previous
      # deploy's scripts. That mix is silent. Stamping the URLs with the
      # commit makes it impossible.
      - name: Stamp assets with the commit, so no cache can serve a stale mix
        run: python3 scripts/stamp_assets.py "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
