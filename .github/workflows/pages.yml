name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 'actions: write' lets configure-pages turn Pages on itself via enablement,
# so the site deploys without anyone flipping the Settings -> Pages switch.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
