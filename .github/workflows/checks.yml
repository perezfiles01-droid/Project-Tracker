name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The scanner is tested before the check that depends on it: a scanner
      # that swallows source makes every view look balanced.
      - name: Scanner self-test
        run: node checks/check_views_selftest.mjs
      - name: Views produce balanced markup
        run: node checks/check_views.mjs
      # Runs before the browser steps, which create node_modules: this must
      # judge the repository as committed, not as the checks leave it.
      - name: Nothing unpublishable is tracked
        run: node checks/check_publishable.mjs
      - name: Links open as tabs, not popup windows
        run: node checks/check_links_open.mjs
      - name: Paged tables behave
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node checks/check_render.mjs
      - name: Email addresses are complete and readable
        run: node checks/check_emails.mjs
      - name: Every page owns a working search
        run: node checks/check_search.mjs
      - name: Table searches sit on the left
        run: node checks/check_layout.mjs
      - name: Authored collections can be renamed and deleted
        run: node checks/check_crud.mjs
      - name: Every table pages
        run: node checks/check_paging.mjs
      - name: Storage is owned by one module
        run: node checks/check_storage.mjs
      - name: Backup saves and restores everything
        run: node checks/check_backup.mjs
      - name: The visible contract holds
        run: node checks/check_ui_bits.mjs
      - name: Task table and dialog behave
        run: node checks/check_tasks.mjs
      - name: The update trail records, stamps and survives the move to the log
        run: node checks/check_updates.mjs
      - name: Long prose is bounded, and only clipped text offers to expand
        run: node checks/check_clamp.mjs
      - name: Undo and redo go seven deep and keep deleted images recoverable
        run: node checks/check_undo.mjs
      - name: Standardize asks for a rewrite, never for invented content
        run: node checks/check_prompt.mjs
      - name: A search shows results, not a list of things that did not match
        run: node checks/check_search_empty.mjs
      - name: A completed task is the same task, on whichever page lists it
        run: node checks/check_daily_pane.mjs
      # The sanitizer runs before the editor: a hole here is script execution
      # in the user's own tracker, from content pasted out of Word.
      - name: Rich text is sanitized, formats, and keeps its tables square
        run: node checks/check_richtext.mjs
      # The central assertion here is that no image byte reaches localStorage:
      # that is the failure that would take the task list down with it.
      - name: Images are stored by reference, land in the cell, and are released
        run: node checks/check_images.mjs
      # One ceiling, read from the app: the number must not live in the field,
      # the help text and the check as three copies that can disagree.
      - name: Every attachments field enforces the same ceiling, and says so
        run: node checks/check_limits.mjs
      - name: The task dialog offers the projects the page lists
        run: node checks/check_task_project.mjs
      - name: Task numbers count 1..n and cannot be typed
        run: node checks/check_task_number.mjs
      - name: The first letter capitalises where it was asked for
        run: node checks/check_capitalize.mjs
      - name: Images and files attach, cap at the ceiling, and download
        run: node checks/check_attachments.mjs
      - name: Several reference links, each with a note and a wand
        run: node checks/check_ref_links.mjs
      - name: The open task is visible, and the artifacts share one search
        run: node checks/check_open_highlight.mjs
      - name: The create date carries its time, and never invents one
        run: node checks/check_create_time.mjs
      - name: Three columns, and the rest of the task beside them
        run: node checks/check_task_split.mjs
      - name: The Project column filters itself
        run: node checks/check_project_filter.mjs
      - name: One status vocabulary, set from the pane
        run: node checks/check_status.mjs
      - name: Artifacts and timeline behave
        run: node checks/check_projects.mjs
      - name: Every delete asks the same question
        run: node checks/check_delete_uniform.mjs
      - name: The Projects page controls hold
        run: node checks/check_project_actions.mjs
      - name: A pinned site holds the top of its table
        run: node checks/check_pin.mjs
      - name: The sidebar and the Projects page agree
        run: node checks/check_nav_projects.mjs
      - name: The Standardize button keeps what you typed
        run: node checks/check_standardize.mjs
      - name: The model picker sorts by tier and purpose
        run: node checks/check_models.mjs
      - name: A task lives on exactly one page
        run: node checks/check_task_flow.mjs
      - name: A deploy cannot serve new HTML with old JavaScript
        run: node checks/check_cachebust.mjs
