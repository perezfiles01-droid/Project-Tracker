name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The scanner is tested before the check that depends on it: a scanner
      # that swallows source makes every view look balanced.
      - name: Scanner self-test
        run: node checks/check_views_selftest.mjs
      - name: Views produce balanced markup
        run: node checks/check_views.mjs
      # Runs before the browser steps, which create node_modules: this must
      # judge the repository as committed, not as the checks leave it.
      - name: Nothing unpublishable is tracked
        run: node checks/check_publishable.mjs
      - name: Links open as tabs, not popup windows
        run: node checks/check_links_open.mjs
      - name: Paged tables behave
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node checks/check_render.mjs
      - name: Email addresses are complete and readable
        run: node checks/check_emails.mjs
      - name: Every page owns a working search
        run: node checks/check_search.mjs
      - name: Table searches sit on the left
        run: node checks/check_layout.mjs
      - name: Authored collections can be renamed and deleted
        run: node checks/check_crud.mjs
      - name: Every table pages
        run: node checks/check_paging.mjs
      - name: Storage is owned by one module
        run: node checks/check_storage.mjs
      - name: Backup saves and restores everything
        run: node checks/check_backup.mjs
      - name: The visible contract holds
        run: node checks/check_ui_bits.mjs
      - name: Task table and dialog behave
        run: node checks/check_tasks.mjs
      - name: Artifacts and timeline behave
        run: node checks/check_projects.mjs
      - name: Every delete asks the same question
        run: node checks/check_delete_uniform.mjs
